packages:
  - apps/*
  - packages/*

catalog:
  '@types/node': ^24.19.2
  typescript: ^5.9.3
  zod: ^4.6.7

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true

ignoredOptionalDependencies:
  - '@nestjs/platform-express'

minimumReleaseAgeExclude:
  - '@nestjs/platform-node@12.3.3'
  - framer-motion@14.9.1
