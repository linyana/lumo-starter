name: lumo-starter

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumo}
      POSTGRES_DB: ${POSTGRES_DB:-lumo}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lumo} -d ${POSTGRES_DB:-lumo}']
      interval: 5s
      timeout: 5s
      retries: 10

# Add a service here (redis, minio, …) when you need one — see "Known gaps" in
# docs/ARCHITECTURE.md for what this starter deliberately ships without.
volumes:
  pgdata:
