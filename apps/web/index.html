<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" type="image/svg+xml" href="/logo.svg" />
		<title>Lumo Starter</title>
		<!--
			Applies the persisted theme before the first paint, so a dark reload never flashes light.
			The key and the default are `hooks/use-global`: change them there and here together.
		-->
		<script>
			try {
				const persisted = JSON.parse(localStorage.getItem('lumo') ?? 'null');
				if (persisted?.state?.theme === 'dark') {
					document.documentElement.classList.add('dark');
				}
			} catch {
				// Storage can be unavailable; the store applies the default once it loads.
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
